  # secret scope my-app-scope / key databricks-pat). The app queries as that user.
  - name: DATABRICKS_PAT
    valueFrom: databricks-pat
  - name: DATABRICKS_HOST
    value: "https://adb-7405617190946816.16.azuredatabricks.net"
  - name: GENIE_SPACE_ID
    value: "01f1c8b8bc9e187595404d6a66c18dc6"


  # Optional settings (defaults in config.py):
